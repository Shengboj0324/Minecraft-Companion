name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Build the plugin and run the tests
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeArchitect
          path: build/libs/ClaudeArchitect-*.jar
          if-no-files-found: error
